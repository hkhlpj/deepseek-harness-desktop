<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;" />
<title>DeepSeek Harness</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1200px 800px at 50% 0%, #16203a 0%, #0b0e14 60%);
    color: #e6ebf5;
    font-family: "Segoe UI", system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  .wrap { text-align: center; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 22px;
    border-radius: 22px;
    background: linear-gradient(150deg, #4d7cff, #7a5cff 55%, #22c1c3);
    box-shadow: 0 18px 44px rgba(77, 124, 255, .35);
    animation: float 2.6s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  h1 { font-size: 19px; font-weight: 600; letter-spacing: .3px; margin: 0 0 10px; }
  p { font-size: 13px; color: #8e9bb3; margin: 0; }
  .bar { width: 210px; height: 3px; margin: 22px auto 0; border-radius: 3px; background: #1c2536; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 40%; border-radius: 3px;
    background: linear-gradient(90deg, #4d7cff, #22c1c3); animation: slide 1.25s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-110%) } 100% { transform: translateX(280%) } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"></div>
    <h1>DeepSeek Harness</h1>
    <p id="hint">Starting the local host&hellip;</p>
    <div class="bar"><i></i></div>
  </div>
  <script>
    const hints = ['Starting the local host\u2026', '\u6b63\u5728\u542f\u52a8\u672c\u5730\u670d\u52a1\u2026'];
    let i = 0;
    setInterval(() => { i = (i + 1) % hints.length; document.getElementById('hint').textContent = hints[i]; }, 3500);
  </script>
</body>
</html>
